on:
  push:
    branches: [main]
  workflow_dispatch:

name: 🚀 Deploy website on push

# One upload at a time: two pushes close together would otherwise mirror over each other,
# and the later deploy waits for the earlier one instead of racing it
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🎉 Deploy
    # Pinned: ubuntu-latest moves to new images over time; change on purpose, not by surprise.
    runs-on: ubuntu-24.04
    steps:
    # The whole history is fetched so each file can be stamped with the time
    # of the commit that last touched it — see the next step.
    - name: 🚚 Get latest code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    # A fresh checkout gives every file the same "just now" timestamp, which
    # would make the upload below send every file on every push. With the
    # last commit time on each file instead, only the files a push actually
    # changed are newer than the server's copies. The history also lists files
    # that were deleted since, so those are skipped.
    - name: 🕰 Stamp files with their last commit time
      run: |
        git log --format='#%ct' --name-only --diff-filter=AM -- . | awk '
          /^#/ { ts = substr($0, 2); next }
          NF && !($0 in seen) { seen[$0] = 1; print ts "\t" $0 }
        ' | while IFS=$'\t' read -r ts path; do
          if [ -f "$path" ]; then touch -d "@$ts" "$path"; fi
        done

    # SFTP on port 22, with SFTP_SERVER, SFTP_USERNAME (the cPanel login),
    # SFTP_PASSWORD and SFTP_PATH (full path of the folder the Laravel app
    # lives in — NOT its public/ folder, e.g. /home/<user>/<domain>). Plain FTP
    # is not used: the host's firewall drops its passive data connections.
    #
    # Nothing is deleted on the server — vendor/, .env, storage/ contents and
    # what admins and visitors add (public/uploads, public/images/rooms/custom,
    # public/images/rooms/thumbs/custom) live there and are not in the repository.
    # vendor/ is never uploaded: it is installed on the server (`composer install
    # --no-dev --optimize-autoloader`, again after composer.lock changes). Every
    # .env* file is excluded. Migrations are run on the server by hand after a deploy
    # that adds one (`php artisan migrate --force`); the last step refreshes the caches.
    # There is no asset build: the pages load public/css and public/js/rv directly,
    # so Vite's files and resources/css, resources/js are not needed on the server.
    - name: 📂 Sync files over SFTP
      env:
        SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
        SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        SFTP_PATH: ${{ secrets.SFTP_PATH }}
      run: |
        for name in SFTP_SERVER SFTP_USERNAME SFTP_PASSWORD SFTP_PATH; do
          if [ -z "${!name}" ]; then
            echo "::error::The $name secret is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi
        done

        # The path goes to lftp unquoted — quoting it made lftp create a
        # folder literally named " and upload the site inside it — so any
        # quotes or spaces pasted into the secret are stripped here.
        SFTP_PATH=$(printf '%s' "$SFTP_PATH" | tr -d "\"' \r\n")

        sudo apt-get update -qq && sudo apt-get install -y -qq lftp

        # The nested .gitignore files are kept on purpose: they make the
        # storage/framework/{cache,sessions,views}, bootstrap/cache and
        # public/uploads folders exist on a fresh server.
        EXCLUDES="
          --exclude '^\.git/'
          --exclude '^\.github/'
          --exclude '^\.gitignore$'
          --exclude '^\.gitattributes$'
          --exclude '^\.editorconfig$'
          --exclude '^\.env'
          --exclude '^vendor/'
          --exclude '^tests/'
          --exclude '^README\.md$'
          --exclude '^phpunit\.xml$'
          --exclude '^package\.json$'
          --exclude '^vite\.config\.js$'
          --exclude '^resources/(css|js)/'
          --exclude '^public/\.htaccess$'
        "
        # One line, or lftp reads each --exclude as a command of its own and
        # runs a bare `mirror` with nothing excluded.
        EXCLUDES=$(printf '%s' "$EXCLUDES" | tr '\n' ' ')

        # lftp's own trace goes to a file and its tail is printed on failure,
        # since "max-retries exceeded" on its own says nothing about why.
        # A single connection: parallel SSH sessions trip cPGuard's
        # connection-burst rate limit on the host.
        set +e
        lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" "sftp://$SFTP_SERVER:22" -e "
          set cmd:fail-exit yes
          debug -o /tmp/sftp-debug.log -t 3
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 60
          cd $SFTP_PATH
          mirror --reverse --only-newer --parallel=1 --verbose --log=/tmp/mirror.log $EXCLUDES . .
          set cmd:fail-exit no
          !echo creating public/uploads/designs, which saving a design writes to without creating it
          mkdir -p public/uploads/designs
          !echo clearing compiled Blade views, which can look newer than the commit-time-stamped templates
          mrm storage/framework/views/*.php
          set cmd:fail-exit yes
          quit
        "
        rc=$?
        if [ -f /tmp/mirror.log ]; then
          echo "Uploaded: $(grep -c '^put' /tmp/mirror.log) files"
          cat /tmp/mirror.log
        else
          echo "Nothing to upload — every file on the server is up to date"
        fi
        if [ $rc -ne 0 ] && [ -f /tmp/sftp-debug.log ]; then
          echo "lftp trace (last 40 lines):"
          grep -vi "password" /tmp/sftp-debug.log | tail -n 40
        fi
        exit $rc

    # public/.htaccess is uploaded on every deploy, not by the mirror above: cPanel
    # writes its own .htaccess into the document root (with the PHP version
    # handler), which is newer than ours, so --only-newer would never replace it
    # and /admin etc. would 404 without Laravel's rewrite rules. cPanel's handler
    # block is copied over from the server's file so the PHP version is kept.
    - name: 🔀 Upload public/.htaccess (keeping cPanel's PHP handler)
      env:
        SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
        SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        SFTP_PATH: ${{ secrets.SFTP_PATH }}
      run: |
        SFTP_PATH=$(printf '%s' "$SFTP_PATH" | tr -d "\"' \r\n")
        mkdir -p /tmp/server
        sftp_run() {
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" "sftp://$SFTP_SERVER:22" -e "
            set sftp:auto-confirm yes
            set net:max-retries 3
            set net:timeout 60
            $1
            quit
          "
        }

        # missing on a fresh server — that is fine
        sftp_run "set cmd:fail-exit no; get $SFTP_PATH/public/.htaccess -o /tmp/server/.htaccess" || true

        cp public/.htaccess /tmp/htaccess
        if [ -f /tmp/server/.htaccess ]; then
          echo "Server's .htaccess before this deploy:"
          cat /tmp/server/.htaccess
          sed -n '/# php -- BEGIN cPanel-generated handler/,/# php -- END cPanel-generated handler/p' /tmp/server/.htaccess > /tmp/handler
          if [ -s /tmp/handler ]; then
            printf '\n' >> /tmp/htaccess
            cat /tmp/handler >> /tmp/htaccess
            echo "Kept cPanel's PHP handler block."
          fi
        fi

        sftp_run "set cmd:fail-exit yes; put /tmp/htaccess -o $SFTP_PATH/public/.htaccess"
        echo "Uploaded public/.htaccess:"
        cat /tmp/htaccess

    # Over SSH (the same cPanel login): drop the old caches, then cache the config, routes and
    # Blade views again, so pages do not re-read them on every visit. This has to run after
    # every deploy — a stale route or config cache would hide what the deploy changed — which
    # is why it is here and not left to be done by hand. Migrations are still run by hand.
    # It only runs when the RUN_POST_DEPLOY secret is exactly `true`: artisan cannot start
    # until the server has vendor/ and .env, so a new server keeps it off until those exist.
    - name: ⚡ Refresh Laravel's caches
      env:
        SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
        SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        SFTP_PATH: ${{ secrets.SFTP_PATH }}
        RUN_POST_DEPLOY: ${{ secrets.RUN_POST_DEPLOY }}
      run: |
        if [ "$(printf '%s' "$RUN_POST_DEPLOY" | tr -d "\"' \r\n")" != "true" ]; then
          echo "::notice::Caches were not refreshed: set the RUN_POST_DEPLOY secret to the word in lowercase once the server has vendor/ and .env"
          exit 0
        fi
        SFTP_PATH=$(printf '%s' "$SFTP_PATH" | tr -d "\"' \r\n")
        sudo apt-get install -y -qq sshpass
        SSHPASS="$SFTP_PASSWORD" sshpass -e ssh -p 22 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
          "$SFTP_USERNAME@$SFTP_SERVER" \
          "cd $SFTP_PATH && php artisan optimize:clear && php artisan config:cache && php artisan route:cache && php artisan view:cache"
